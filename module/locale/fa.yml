bugfixes: رفع خطاها
catapults_drop_destroyed: توقف شلیک به اهداف نابودشده
catapults_drop_destroyed_details: ادوات محاصره با نابود شدن ساختمانی که نشانه گرفته‌اند، شلیک را متوقف می‌کنند.
catapults_enabled: هدف‌گیری منجنیق‌ها و تریبوشت‌های هوش مصنوعی روی اهداف محاصره
catapults_enabled_details: ادوات دوربرد از درون برد شلیک، استحکامات دشمن را نشانه می‌گیرند.
catapults_group: منجنیق‌ها و تریبوشت‌های هوش مصنوعی
catapults_on_the_way: توقف برای شلیک در مسیر
catapults_on_the_way_details: ادوات محاصره با قرار گرفتن هدف محاصره در برد، شلیک می‌کنند.
catapults_other_enemies: شلیک به دیگر دشمنان در برد نیز
catapults_other_enemies_details: وقتی حریف تعیین‌شده خارج از برد است، ادوات می‌توانند به ساختمان‌های دشمنان دیگر شلیک کنند.
fixes: اصلاحات
improvements: بهبودها
oil_aim: ریختن روغن روی زمین باز
oil_aim_details: مهندس حامل روغن را انتخاب کرده و فرمان حملهٔ معمول را روی زمین باز بدهید.
oil_damage: روغن شعله‌ور به ساختمان‌ها آسیب می‌زند
oil_damage_details: با رسیدن روغن در حال گسترش به ساختمان‌ها، به آن‌ها آسیب وارد می‌شود.
oil_group: روغن شعله‌ور
oil_spread: گسترش روغن روی زمین
oil_spread_details: روغن ریخته‌شده آتش را به زمین‌های اطراف گسترش می‌دهد.
shields_enabled: همراهی سپرهای هوش مصنوعی با نیروهای خودی
shields_enabled_details: سپرهای هوش مصنوعی برای محافظت از نیروهای خودی آن‌ها را دنبال می‌کنند.
tags.behavior: رفتار
tents_engineers: اجازهٔ ورود مهندسان به چادرهایشان
tents_engineers_details: مهندسان گماشته‌شدهٔ هوش مصنوعی می‌توانند به چادرهای محاصرهٔ خود برسند و وارد شوند.
tents_free: استفادهٔ دوباره از جایگاه‌های خالی چادر محاصره
tents_free_details: هوش مصنوعی می‌تواند چادرهای محاصرهٔ جدیدی در جایگاه‌های قابل استفادهٔ پاک‌سازی‌شده بسازد.
tents_group: چادرهای محاصرهٔ هوش مصنوعی
tents_range: ساخت چادرهای محاصرهٔ دوربرد در برد شلیک
tents_range_details: هوش مصنوعی چادرهای منجنیق، تریبوشت و بالیستای آتشین را جایی می‌سازد که این ادوات بتوانند به هدف شلیک کنند.
towers_ai_passengers: سوار کردن نیروهای دوربرد در برج‌های محاصره توسط هوش مصنوعی
towers_ai_passengers_details: برج‌های محاصرهٔ هوش مصنوعی می‌توانند نیروهای دوربرد سوار کنند.
towers_dock: چسباندن برج‌های محاصره به دیوارهای بیشتر
towers_dock_details: به برج محاصره فرمان دهید به دیوار، از جمله دیوارهای مورب، بچسبد.
towers_group: خدمهٔ برج محاصره
towers_orders: انتخاب دیوار برای چسبیدن توسط برج‌های محاصرهٔ هوش مصنوعی
towers_orders_details: برج‌های محاصرهٔ هوش مصنوعی دیواری دسترس‌پذیر می‌یابند و به آن می‌چسبند.
towers_passenger_slow: کند شدن برج‌های حامل پنج نیرو یا بیشتر
towers_passenger_slow_tooltip: برج محاصره هنگام حمل پنج نیرو یا بیشتر کندتر حرکت می‌کند.
towers_passengers: حمل نیرو با برج‌های محاصره
towers_passengers_details: برای سوار کردن پیاده‌نظام، آن‌ها را انتخاب کنید و روی برج محاصرهٔ خودی کلیک کنید. برای پیاده کردنشان، برج را انتخاب کنید و با نشانگر خروج از ادوات روی آن کلیک کنید.
cat_siege_crews: خدمه و تجهیزات محاصره
cat_siege_digging: تجهیزات محاصره و حفاری
cat_siege_sapping: محاصره و نقب‌زنی
cat_siege_targeting: محاصره و هدف‌گیری
