ai: ИИ
balance_changes: Изменения баланса
bugfixes: Исправления ошибок
catapults_drop_destroyed: Прекращать огонь по разрушенным целям
catapults_drop_destroyed_details: Осадные орудия прекращают стрельбу, когда здание-цель разрушено.
catapults_enabled: Наводить катапульты и требюше ИИ на осадные цели
catapults_enabled_details: Дальнобойные орудия наводятся на укрепления врага в пределах дальности стрельбы.
catapults_group: Катапульты и требюше ИИ
catapults_on_the_way: Останавливаться для стрельбы по пути
catapults_on_the_way_details: Орудия открывают огонь, как только осадная цель оказывается в пределах досягаемости.
catapults_other_enemies: Стрелять и по другим врагам в пределах дальности
catapults_other_enemies_details: Орудия могут обстреливать другие вражеские постройки, если назначенный противник вне досягаемости.
fixes: Исправления
improvements: Улучшения
oil_aim: Выливать масло на открытую землю
oil_aim_details: Выберите инженера с маслом и отдайте обычный приказ атаки по открытой земле.
oil_damage: Горящее масло повреждает здания
oil_damage_details: Здания получают урон, когда до них добирается растекающееся масло.
oil_group: Горящее масло
oil_spread: Масло растекается по земле
oil_spread_details: Вылитое масло распространяет огонь по соседней земле.
shields_enabled: Щиты ИИ держатся рядом со своими войсками
shields_enabled_details: Щиты ИИ сопровождают дружественные войска и прикрывают их.
tags.behavior: Поведение
tents_engineers: Позволять инженерам входить в свои палатки
tents_engineers_details: Назначенные инженеры ИИ могут добраться до своих осадных палаток и зайти в них.
tents_free: Осадные палатки на освободившихся местах
tents_free_details: ИИ может строить новые осадные палатки на расчищенных пригодных местах.
tents_group: Осадные палатки ИИ
tents_range: Ставить палатки дальнобойных орудий в пределах дальности
tents_range_details: ИИ ставит палатки для катапульт, требюше и огневых баллист так, чтобы орудия доставали до цели.
towers_ai_passengers: ИИ сажает стрелков в осадные башни
towers_ai_passengers_details: Осадные башни ИИ могут брать на борт стрелковые войска.
towers_dock: Пристыковывать осадные башни к большему числу стен
towers_dock_details: Отдайте осадной башне приказ пристыковаться к стене, включая диагональные стены.
towers_group: Экипажи осадных башен
towers_orders: Осадные башни ИИ выбирают стену для стыковки
towers_orders_details: Осадные башни ИИ ищут доступную стену и пристыковываются к ней.
towers_passenger_slow: Замедлять башни с пятью и более бойцами
towers_passenger_slow_tooltip: Осадная башня замедляется, когда перевозит пять или более воинов.
towers_passengers: Перевозить войска в осадных башнях
towers_passengers_details: Для посадки выберите пехоту и щёлкните по союзной осадной башне. Для высадки выберите башню и щёлкните по ней указателем выхода из осадного орудия.
cat_siege_crews: Осадные расчёты и техника
cat_siege_digging: Осадная техника и земляные работы
cat_siege_sapping: Осада и подкопы
cat_siege_targeting: Осада и выбор целей
