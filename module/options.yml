meta:
  version: 1.0.0
options:
- display: GroupBox
  category: [Improved Siegeengines]
  header: '{{catapults_group}}'
  text: '{{catapults_group_descr}}'
  hasHeader: true
  children:
  - url: improved-siegeengines.catapults.enabled
    name: improved-siegeengines-catapults-enabled
    text: '{{catapults_enabled}}'
    tooltip: '{{catapults_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: improved-siegeengines.catapults.on_the_way
    name: improved-siegeengines-catapults-on-the-way
    text: '{{catapults_on_the_way}}'
    tooltip: '{{catapults_on_the_way_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: improved-siegeengines.catapults.other_enemies
    name: improved-siegeengines-catapults-other-enemies
    text: '{{catapults_other_enemies}}'
    tooltip: '{{catapults_other_enemies_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: improved-siegeengines.catapults.drop_destroyed
    name: improved-siegeengines-catapults-drop-destroyed
    text: '{{catapults_drop_destroyed}}'
    tooltip: '{{catapults_drop_destroyed_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: improved-siegeengines.catapults.scatter
    name: improved-siegeengines-catapults-scatter
    text: '{{catapults_scatter}}'
    tooltip: '{{catapults_scatter_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 50
      min: 0
      max: 100
      step: 10

